# Development-only Compose: builds the local Dockerfile. Release bundles use docker-compose.release.yml.
services:
  # ── CLI / REPL ──
  wukong:
    profiles: ["cli"]
    build:
      context: .
      dockerfile: Dockerfile
    image: wukong:latest
    container_name: wukong-cli
    # Run with host-matching UID/GID to avoid permission issues on mounts
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      # Agent backend configuration
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
    volumes:
      # Host working directory → opencode workspace
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      # Dedicated volume for opencode config (isolated from host ~/.config)
      - opencode-config:/home/wukong/.config/opencode
      # Persistent opencode sessions/state (paired with Wukong agent_sessions)
      - opencode-state:/home/wukong/.local/share/opencode
      # Persistent Agent Reach channel config/cookies
      - agent-reach-state:/home/wukong/.agent-reach
      # Persistent GitHub CLI auth/config
      - gh-config:/home/wukong/.config/gh
      # Persistent memory database
      - wukong-data:/data
    # Default to interactive shell / REPL
    stdin_open: true
    tty: true
    command: ["wukong"]
    # This profile has no WUKONG_AGENT_SERVER_URL, so it runs `opencode run` inside
    # its OWN container rather than talking to opencode-server. It therefore needs
    # agent-sized limits, not the smaller client-side ones the other services get.
    cpus: "${WUKONG_OPENCODE_CPUS:-1.5}"
    mem_limit: "${WUKONG_OPENCODE_MEM:-2g}"
    pids_limit: ${WUKONG_OPENCODE_PIDS:-256}

  # ── Opencode Server Backend ──
  opencode-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wukong:latest
    container_name: wukong-opencode-server
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_WORKSPACE=/workspace
      # The idle-restart window below is a LOCAL-time range, so TZ decides what it
      # actually means. Defaulting to UTC made 03:00 land at 11:00 in +08:00 and the
      # only symptom would be "the restart never happens when I expect" — so the
      # default lives here, where it ships with every release, rather than in .env,
      # which existing deployments would never receive. Override in .env if you are
      # not in +08:00.
      - TZ=${TZ:-Asia/Taipei}
      # Empty disables the periodic restart entirely. Note the `-` (not `:-`): with
      # `:-` an empty value would fall back to the default and silently re-enable it.
      - WUKONG_OPENCODE_RESTART_WINDOW=${WUKONG_OPENCODE_RESTART_WINDOW-03:00-05:00}
      - WUKONG_OPENCODE_RESTART_MIN_UPTIME_SECS=${WUKONG_OPENCODE_RESTART_MIN_UPTIME_SECS:-43200}
      - WUKONG_OPENCODE_IDLE_QUIET_SECS=${WUKONG_OPENCODE_IDLE_QUIET_SECS:-300}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped
    # opencode installs a handler for SIGINT only (SigCgt 0x10002) and none for
    # SIGTERM. The kernel drops default-action signals sent to PID 1, so the usual
    # SIGTERM from `docker stop` is silently ignored and every shutdown waits out the
    # 10s grace period before being SIGKILLed — no clean SQLite WAL checkpoint.
    # SIGINT exits in ~0.1s cleanly.
    stop_signal: SIGINT
    # Agent turns run here, so this is the container that can eat the host. Tune via
    # .env (preserved across `install.sh --upgrade`) — do NOT hand-edit the values
    # below, this file is bundle-owned and gets overwritten on upgrade.
    cpus: "${WUKONG_OPENCODE_CPUS:-1.5}"
    mem_limit: "${WUKONG_OPENCODE_MEM:-2g}"
    mem_reservation: "512m"
    pids_limit: ${WUKONG_OPENCODE_PIDS:-256}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:4096/global/health || exit 1",
        ]
      # Three services wait for this container to report healthy before they start,
      # so the first probe must stay fast — that is what start_interval is for.
      # Steady-state probing relaxes
      # to 30s: at 2s this forked a shell+curl inside this container's cgroup ~43k
      # times a day, and that CPU lands in `docker stats` where it reads as opencode's
      # own idle load. Requires Docker Engine 25.0+ for start_interval.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # ── Telegram Bot ──
  wukong-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    image: wukong:latest
    container_name: wukong-telegram
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_SERVER_FILE_MODE=${WUKONG_AGENT_SERVER_FILE_MODE:-shared}
      - WUKONG_AGENT_SERVER_WORKSPACE=${WUKONG_AGENT_SERVER_WORKSPACE:-/workspace}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      # Telegram-specific
      - WUKONG_TG_TOKEN
      - WUKONG_TG_ALLOWED
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-telegram"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, so the heavy work happens there, not here.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}

  # ── Web Console ──
  wukong-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wukong:latest
    container_name: wukong-web
    # SECURITY: the console can run agent turns, read memory, and edit settings.
    # The container ALWAYS binds 0.0.0.0:8787 inside (required for Docker port
    # mapping); the real exposure is the host-side bind below. The default maps to
    # 127.0.0.1 only — reachable from this host, NOT the LAN. To expose on the LAN,
    # set WUKONG_WEB_BIND=0.0.0.0 AND WUKONG_WEB_TOKEN=<secret> (and consider
    # WUKONG_WEB_ALLOW_INSECURE=0 so a missing token refuses to start).
    # WUKONG_WEB_PORT changes only the host-side port; the container stays on 8787.
    ports:
      - "${WUKONG_WEB_BIND:-127.0.0.1}:${WUKONG_WEB_PORT:-8787}:8787"
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_SERVER_FILE_MODE=${WUKONG_AGENT_SERVER_FILE_MODE:-shared}
      - WUKONG_AGENT_SERVER_WORKSPACE=${WUKONG_AGENT_SERVER_WORKSPACE:-/workspace}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      # Web-specific: the container binds 0.0.0.0:8787 internally, so the security
      # boundary is the host mapping above (WUKONG_WEB_BIND), not an app token.
      # ALLOW_INSECURE therefore defaults to 1; set WUKONG_WEB_TOKEN when exposing
      # beyond loopback. WUKONG_WEB_HOST/PORT are fixed here so the mapping holds.
      - WUKONG_WEB_HOST=0.0.0.0
      - WUKONG_WEB_TOKEN=${WUKONG_WEB_TOKEN:-}
      - WUKONG_WEB_ALLOW_INSECURE=${WUKONG_WEB_ALLOW_INSECURE:-1}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-web"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, so the heavy work happens there, not here.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}
    # Unauthenticated liveness probe (see wukong-web /healthz). Runs inside the
    # container, which always listens on the fixed 8787 (WUKONG_WEB_PORT only
    # remaps the host-side port, so the probe stays valid regardless).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8787/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Scheduler Daemon ──
  wukong-schedulerd:
    build:
      context: .
      dockerfile: Dockerfile
    image: wukong:latest
    container_name: wukong-schedulerd
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_SERVER_FILE_MODE=${WUKONG_AGENT_SERVER_FILE_MODE:-shared}
      - WUKONG_AGENT_SERVER_WORKSPACE=${WUKONG_AGENT_SERVER_WORKSPACE:-/workspace}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      - WUKONG_MEMORY_AUTO_MAINTENANCE=${WUKONG_MEMORY_AUTO_MAINTENANCE:-1}
      - WUKONG_MEMORY_MAINTENANCE_INTERVAL_SECS=${WUKONG_MEMORY_MAINTENANCE_INTERVAL_SECS:-900}
      - WUKONG_MEMORY_CONSOLIDATE_THRESHOLD=${WUKONG_MEMORY_CONSOLIDATE_THRESHOLD:-40}
      - WUKONG_SCHED_PERMISSION=${WUKONG_SCHED_PERMISSION:-reject}
      # 排程結果回送 Telegram 需要它；沒有這個變數 build_notifier() 會靜靜停用通知，
      # job 照跑但結果永遠送不出去。設 WUKONG_SCHED_NOTIFY=0 才是刻意關閉。
      - WUKONG_TG_TOKEN
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-schedulerd"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, but also runs memory maintenance locally.
    # Raise WUKONG_SVC_MEM if you turn on WUKONG_EMBED=1 here — the local embedding
    # model is loaded in this process, not in opencode-server.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}

volumes:
  # Isolated opencode configuration (not mounted from host)
  opencode-config:
    driver: local
  # Persistent opencode sessions/state (not mounted from host)
  opencode-state:
    driver: local
  # Persistent Agent Reach channel config/cookies
  agent-reach-state:
    driver: local
  # Persistent GitHub CLI auth/config
  gh-config:
    driver: local
  # Persistent wukong memory database
  wukong-data:
    driver: local
