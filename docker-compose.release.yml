# Release deployment template. Packaging replaces __WUKONG_VERSION__ with the product tag.
services:
  wukong:
    profiles: ["cli"]
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-cli
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    stdin_open: true
    tty: true
    command: ["wukong"]

  opencode-server:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-opencode-server
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_WORKSPACE=/workspace
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4096/global/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  wukong-telegram:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-telegram
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_TG_TOKEN
      - WUKONG_TG_ALLOWED
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-telegram"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped

  wukong-web:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-web
    ports:
      - "${WUKONG_WEB_BIND:-127.0.0.1}:${WUKONG_WEB_PORT:-8787}:8787"
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_WEB_HOST=0.0.0.0
      - WUKONG_WEB_TOKEN=${WUKONG_WEB_TOKEN:-}
      - WUKONG_WEB_ALLOW_INSECURE=${WUKONG_WEB_ALLOW_INSECURE:-1}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-web"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wukong-schedulerd:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-schedulerd
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-schedulerd"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opencode-config:
    driver: local
  opencode-state:
    driver: local
  agent-reach-state:
    driver: local
  gh-config:
    driver: local
  wukong-data:
    driver: local
