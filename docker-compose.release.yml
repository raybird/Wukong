# Release deployment template. Packaging replaces __WUKONG_VERSION__ with the product tag.
services:
  wukong:
    profiles: ["cli"]
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-cli
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    stdin_open: true
    tty: true
    command: ["wukong"]
    # This profile has no WUKONG_AGENT_SERVER_URL, so it runs `opencode run` inside
    # its OWN container rather than talking to opencode-server. It therefore needs
    # agent-sized limits, not the smaller client-side ones the other services get.
    cpus: "${WUKONG_OPENCODE_CPUS:-1.5}"
    mem_limit: "${WUKONG_OPENCODE_MEM:-2g}"
    pids_limit: ${WUKONG_OPENCODE_PIDS:-256}

  opencode-server:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-opencode-server
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_WORKSPACE=/workspace
      # The idle-restart window is a LOCAL-time range, so TZ decides what it means.
      # Without tzdata + TZ the container is UTC and 03:00 lands mid-afternoon.
      - TZ=${TZ:-UTC}
      # Empty disables the periodic restart entirely. Note the `-` (not `:-`): with
      # `:-` an empty value would fall back to the default and silently re-enable it.
      - WUKONG_OPENCODE_RESTART_WINDOW=${WUKONG_OPENCODE_RESTART_WINDOW-03:00-05:00}
      - WUKONG_OPENCODE_RESTART_MIN_UPTIME_SECS=${WUKONG_OPENCODE_RESTART_MIN_UPTIME_SECS:-43200}
      - WUKONG_OPENCODE_IDLE_QUIET_SECS=${WUKONG_OPENCODE_IDLE_QUIET_SECS:-300}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    restart: unless-stopped
    # opencode installs a handler for SIGINT only (SigCgt 0x10002) and none for
    # SIGTERM. The kernel drops default-action signals sent to PID 1, so the usual
    # SIGTERM from `docker stop` is silently ignored and every shutdown waits out the
    # 10s grace period before being SIGKILLed — no clean SQLite WAL checkpoint.
    # SIGINT exits in ~0.1s cleanly.
    stop_signal: SIGINT
    # Agent turns run here, so this is the container that can eat the host. Tune via
    # .env (preserved across `install.sh --upgrade`) — do NOT hand-edit the values
    # below, this file is bundle-owned and gets overwritten on upgrade.
    cpus: "${WUKONG_OPENCODE_CPUS:-1.5}"
    mem_limit: "${WUKONG_OPENCODE_MEM:-2g}"
    mem_reservation: "512m"
    pids_limit: ${WUKONG_OPENCODE_PIDS:-256}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4096/global/health || exit 1"]
      # Three services wait for this container to report healthy before they start,
      # so the first probe must stay fast — that is what start_interval is for.
      # Steady-state probing relaxes
      # to 30s: at 2s this forked a shell+curl inside this container's cgroup ~43k
      # times a day, and that CPU lands in `docker stats` where it reads as opencode's
      # own idle load. Requires Docker Engine 25.0+ for start_interval.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  wukong-telegram:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-telegram
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      - WUKONG_TG_TOKEN
      - WUKONG_TG_ALLOWED
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-telegram"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, so the heavy work happens there, not here.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}

  wukong-web:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-web
    ports:
      - "${WUKONG_WEB_BIND:-127.0.0.1}:${WUKONG_WEB_PORT:-8787}:8787"
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      - WUKONG_WEB_HOST=0.0.0.0
      - WUKONG_WEB_TOKEN=${WUKONG_WEB_TOKEN:-}
      - WUKONG_WEB_ALLOW_INSECURE=${WUKONG_WEB_ALLOW_INSECURE:-1}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-web"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, so the heavy work happens there, not here.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wukong-schedulerd:
    image: ghcr.io/raybird/wukong:__WUKONG_VERSION__
    container_name: wukong-schedulerd
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - WUKONG_AGENT_CMD=${WUKONG_AGENT_CMD:-opencode run --dangerously-skip-permissions}
      - WUKONG_AGENT_SERVER_URL=${WUKONG_AGENT_SERVER_URL:-http://opencode-server:4096}
      - WUKONG_AGENT_TIMEOUT_SECS=${WUKONG_AGENT_TIMEOUT_SECS:-1200}
      - WUKONG_WORKSPACE=/workspace
      - WUKONG_MEMORY_DB=sqlite:///data/memory.db
      - WUKONG_THINKING=${WUKONG_THINKING:-1}
      - WUKONG_EMBED=${WUKONG_EMBED:-0}
      - WUKONG_SESSION_COMPACT_EVERY_TURNS=${WUKONG_SESSION_COMPACT_EVERY_TURNS:-20}
      - WUKONG_SESSION_LEASE_SECS=${WUKONG_SESSION_LEASE_SECS:-900}
      - WUKONG_MEMORY_AUTO_MAINTENANCE=${WUKONG_MEMORY_AUTO_MAINTENANCE:-1}
      - WUKONG_MEMORY_MAINTENANCE_INTERVAL_SECS=${WUKONG_MEMORY_MAINTENANCE_INTERVAL_SECS:-900}
      - WUKONG_MEMORY_CONSOLIDATE_THRESHOLD=${WUKONG_MEMORY_CONSOLIDATE_THRESHOLD:-40}
      - WUKONG_SCHED_PERMISSION=${WUKONG_SCHED_PERMISSION:-reject}
    volumes:
      - ${WUKONG_HOST_WORKSPACE:-./workspace}:/workspace
      - opencode-config:/home/wukong/.config/opencode
      - opencode-state:/home/wukong/.local/share/opencode
      - agent-reach-state:/home/wukong/.agent-reach
      - gh-config:/home/wukong/.config/gh
      - wukong-data:/data
    command: ["wukong-schedulerd"]
    depends_on:
      opencode-server:
        condition: service_healthy
    restart: unless-stopped
    # Talks to opencode-server over HTTP, but also runs memory maintenance locally.
    # Raise WUKONG_SVC_MEM if you turn on WUKONG_EMBED=1 here — the local embedding
    # model is loaded in this process, not in opencode-server.
    cpus: "${WUKONG_SVC_CPUS:-0.5}"
    mem_limit: "${WUKONG_SVC_MEM:-768m}"
    pids_limit: ${WUKONG_SVC_PIDS:-128}

volumes:
  opencode-config:
    driver: local
  opencode-state:
    driver: local
  agent-reach-state:
    driver: local
  gh-config:
    driver: local
  wukong-data:
    driver: local
