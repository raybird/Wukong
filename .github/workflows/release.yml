name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web; do
            cp $bin ../../../dist/
            tar -czf ../../../dist/$bin-${{ matrix.target }}.tar.gz $bin
          done
          cd ../../..
          sha256sum dist/*.tar.gz > dist/checksums-${{ matrix.target }}.txt

      - name: Package Docker compose bundle
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          mkdir -p dist/wukong-docker/scripts
          cp .env.example dist/wukong-docker/.env.example
          cp Dockerfile dist/wukong-docker/Dockerfile
          cp scripts/docker-entrypoint.sh dist/wukong-docker/scripts/docker-entrypoint.sh
          cp docker-compose.yml dist/wukong-docker/docker-compose.yml
          cd dist
          tar -czf wukong-docker.tar.gz wukong-docker
          rm -rf wukong-docker

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web; do
            cp $bin ../../../dist/
            tar -czf ../../../dist/$bin-${{ matrix.target }}.tar.gz $bin
          done
          cd ../../..
          shasum -a 256 dist/*.tar.gz > dist/checksums-${{ matrix.target }}.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true