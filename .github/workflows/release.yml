name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Validate tag and promotion metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          rc_re='^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'
          stable_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          printf 'validate: tag=%q\n' "$tag"
          [[ "$tag" =~ $rc_re || "$tag" =~ $stable_re ]] || { printf 'validate: invalid tag\n' >&2; exit 1; }
          source_tag_ref="refs/tags/release-source/$tag"
          git fetch --no-tags origin "refs/tags/$tag:$source_tag_ref"
          tag_type="$(git cat-file -t "$source_tag_ref")"
          printf 'validate: tag_type=%s\n' "$tag_type"
          [[ "$tag_type" == tag ]] || { printf 'validate: tag is not annotated\n' >&2; exit 1; }
          annotation="$(git for-each-ref "$source_tag_ref" --format='%(contents)')"
          printf 'validate: annotation=%q\n' "$annotation"
          if [[ "$tag" =~ $rc_re ]]; then
            channel=rc
            printf 'validate: channel=rc\n'
          else
            channel=stable
            printf 'validate: channel=stable\n'
          fi
          printf 'tag=%s\nchannel=%s\ncommit=%s\n' "$tag" "$channel" "$(git rev-parse "$source_tag_ref^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Validate locked dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package target archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/public dist/binaries
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web wukong-schedulerd; do
            tar -czf "../../../dist/public/$bin-${{ matrix.target }}.tar.gz" "$bin"
            if [[ "${{ matrix.target }}" == x86_64-unknown-linux-musl ]]; then cp "$bin" "../../../dist/binaries/$bin"; fi
          done
          cd ../../..
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/public/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with:
          name: musl-binaries
          path: dist/binaries/
          retention-days: 1
          if-no-files-found: error

  publish-image:
    name: Publish or promote image
    needs: [validate, build-binaries]
    if: needs.validate.result == 'success' && needs.build-binaries.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Install registry client
        run: |
          set -euo pipefail
          REGCTL_VERSION=v0.8.1
          curl -fsSL "https://github.com/regclient/regclient/releases/download/${REGCTL_VERSION}/regctl-linux-amd64" -o /usr/local/bin/regctl
          chmod +x /usr/local/bin/regctl
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: musl-binaries
          path: release-context/binaries
      - id: image
        name: Build and publish image
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/raybird/wukong
          digest_of() { regctl image digest "$1" 2>/dev/null || true; }
          attach_immutable() {
            local tag="$1" expected="$2" actual
            actual="$(digest_of "$image:$tag")"
            if [[ -n "$actual" && "$actual" != "$expected" ]]; then
              printf 'immutable tag conflict: %s resolves to %s, expected %s\n' "$tag" "$actual" "$expected" >&2
              exit 1
            fi
            if [[ -z "$actual" ]]; then regctl image copy "$image@$expected" "$image:$tag"; fi
            [[ "$(digest_of "$image:$tag")" == "$expected" ]]
          }
          mkdir -p release-context/release release-context/workspace release-context/crates/wukong-skills/assets release-context/scripts
          cp Dockerfile.release release-context/
          cp release/package.json release/package-lock.json release-context/release/
          cp workspace/SOUL.md workspace/AGENTS.md release-context/workspace/
          cp -R crates/wukong-skills/assets/superpowers release-context/crates/wukong-skills/assets/
          cp scripts/docker-entrypoint.sh release-context/scripts/
          set -a; source release/runtime-inputs.env; set +a
          created="$(git show -s --format=%cI "$COMMIT")"
          docker buildx build --platform linux/amd64 --push --metadata-file metadata.json \
            --file release-context/Dockerfile.release --tag "$image:build-$COMMIT" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" --build-arg DEBIAN_SNAPSHOT="$DEBIAN_SNAPSHOT" \
            --build-arg OPENCODE_VERSION="$OPENCODE_VERSION" --build-arg AGENT_REACH_REF="$AGENT_REACH_REF" \
            --build-arg AGENT_REACH_ARCHIVE_SHA256="$AGENT_REACH_ARCHIVE_SHA256" --build-arg PRODUCT_TAG="$TAG" \
            --build-arg BUILD_ORIGIN_TAG="$TAG" --build-arg REVISION="$COMMIT" \
            --build-arg CREATED="$created" release-context
          image_digest="$(python3 -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')"
          attach_immutable "$TAG" "$image_digest"
          attach_immutable "sha-$COMMIT" "$image_digest"
          if [[ "$CHANNEL" == stable ]]; then regctl image copy "$image@$image_digest" "$image:latest"; fi
          docker buildx imagetools inspect "$image@$image_digest" >/dev/null
          printf 'digest=%s\n' "$image_digest" >> "$GITHUB_OUTPUT"

  package-release:
    name: Package release assets
    needs: [validate, build-binaries, publish-image]
    if: always() && needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: artifacts
          merge-multiple: true
      - name: Assemble public artifacts
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/* dist/
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin; do
            test "$(find dist -maxdepth 1 -name "*-$target.tar.gz" -type f | wc -l | tr -d ' ')" = 4
          done
          sed "s/__WUKONG_VERSION__/$TAG/g" docker-compose.release.yml > dist/docker-compose.yml
          ! grep -Eq '__WUKONG_VERSION__|^[[:space:]]*build:' dist/docker-compose.yml
          mkdir -p dist/wukong-docker/scripts
          cp dist/docker-compose.yml dist/wukong-docker/docker-compose.yml
          cp .env.example LICENSE dist/wukong-docker/
          cp release/data-compatibility.json dist/wukong-docker/
          cp scripts/install.sh dist/wukong-docker/scripts/install.sh
          runtime_inputs="$(python3 -c 'import json; d={}; [d.__setitem__(*line.strip().split("=", 1)) for line in open("release/runtime-inputs.env") if line.strip() and not line.startswith("#")]; print(json.dumps(d, sort_keys=True))')"
          scripts/generate-release-manifest.sh --tag "$TAG" --commit "$COMMIT" --channel "$CHANNEL" --image-reference "ghcr.io/raybird/wukong:$TAG" --image-digest "$IMAGE_DIGEST" --platform linux/amd64 --runtime-inputs "$runtime_inputs" --data-compatibility release/data-compatibility.json --output dist/wukong-docker/release-manifest.json
          cp dist/wukong-docker/release-manifest.json dist/release-manifest.json
          tar -C dist -czf "dist/wukong-docker-$TAG.tar.gz" wukong-docker
          rm -rf dist/wukong-docker dist/docker-compose.yml
          scripts/generate-sha256sums.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: package-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
