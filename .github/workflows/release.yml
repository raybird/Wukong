name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Build every target in parallel, but DO NOT upload to the release here.
  # Each job publishes its artifacts to the workflow run; the single `publish`
  # job below collects them and uploads once. This avoids the concurrency race
  # where parallel matrix jobs stepped on each other's release-asset writes
  # (softprops "Not Found - delete-a-release-asset").
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          # Apple Silicon only. Intel (x86_64-apple-darwin) was dropped:
          # Apple shipped arm64 since 2020 and stopped selling Intel Macs in
          # 2023, and it was already a cross-compile from the arm64 runner.
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web wukong-schedulerd; do
            cp "$bin" ../../../dist/
            tar -czf "../../../dist/$bin-${{ matrix.target }}.tar.gz" "$bin"
          done
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/*.tar.gz > "dist/checksums-${{ matrix.target }}.txt"
          else
            shasum -a 256 dist/*.tar.gz > "dist/checksums-${{ matrix.target }}.txt"
          fi

      - name: Package Docker compose bundle
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/wukong-docker/scripts dist/wukong-docker/workspace dist/wukong-docker/crates/wukong-skills/assets
          cp .env.example dist/wukong-docker/.env.example
          cp Dockerfile dist/wukong-docker/Dockerfile
          sed -i "s/^ARG VERSION=.*/ARG VERSION=${VERSION}/" dist/wukong-docker/Dockerfile
          cp scripts/docker-entrypoint.sh dist/wukong-docker/scripts/docker-entrypoint.sh
          cp docker-compose.yml dist/wukong-docker/docker-compose.yml
          cp -R crates/wukong-skills/assets/superpowers dist/wukong-docker/crates/wukong-skills/assets/superpowers
          cp workspace/SOUL.md dist/wukong-docker/workspace/SOUL.md
          cp workspace/AGENTS.md dist/wukong-docker/workspace/AGENTS.md
          cd dist
          tar -czf "wukong-docker-${VERSION}.tar.gz" wukong-docker
          rm -rf wukong-docker

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Single serialized publish step: collect every target's artifacts and upload
  # them to the release in one action invocation, so there is no cross-job race.
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist
          # Flatten every target's dist/ into one directory. Target-suffixed
          # tarballs, checksums, and the docker bundle are uniquely named; the
          # bare binaries share a name across targets and collapse to one
          # (unchanged from the previous release layout).
          find artifacts -type f -exec cp -f {} dist/ \;
          ls -la dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
