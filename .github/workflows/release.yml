name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web wukong-schedulerd; do
            cp $bin ../../../dist/
            tar -czf ../../../dist/$bin-${{ matrix.target }}.tar.gz $bin
          done
          cd ../../..
          sha256sum dist/*.tar.gz > dist/checksums-${{ matrix.target }}.txt

      - name: Package Docker compose bundle
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist/wukong-docker/scripts dist/wukong-docker/workspace dist/wukong-docker/crates/wukong-skills/assets
          cp .env.example dist/wukong-docker/.env.example
          cp Dockerfile dist/wukong-docker/Dockerfile
          sed -i "s/^ARG VERSION=.*/ARG VERSION=${VERSION}/" dist/wukong-docker/Dockerfile
          cp scripts/docker-entrypoint.sh dist/wukong-docker/scripts/docker-entrypoint.sh
          cp docker-compose.yml dist/wukong-docker/docker-compose.yml
          cp -R crates/wukong-skills/assets/superpowers dist/wukong-docker/crates/wukong-skills/assets/superpowers
          cp workspace/SOUL.md dist/wukong-docker/workspace/SOUL.md
          cp workspace/AGENTS.md dist/wukong-docker/workspace/AGENTS.md
          cd dist
          tar -czf "wukong-docker-${VERSION}.tar.gz" wukong-docker
          rm -rf wukong-docker

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}

  build-macos:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Intel 二進位以 macos-latest（Apple Silicon）交叉編譯產出；
          # macos-13 Intel runner 已退役，指定它會卡 queue 到 24h 被取消。
          - target: x86_64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          for bin in wukong wukong-telegram wukong-web wukong-schedulerd; do
            cp $bin ../../../dist/
            tar -czf ../../../dist/$bin-${{ matrix.target }}.tar.gz $bin
          done
          cd ../../..
          shasum -a 256 dist/*.tar.gz > dist/checksums-${{ matrix.target }}.txt

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
