[workspace]
resolver = "2"
members = ["crates/wukong-memory", "crates/wukong-memoryd", "crates/wukong-gateway", "crates/wukong-orchestrator", "crates/wukong-skills", "crates/wukong-cli", "crates/wukong-telegram", "crates/wukong-render", "crates/wukong-web"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tower = "0.5"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = { version = "0.12", default-features = false }
tokio-stream = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
