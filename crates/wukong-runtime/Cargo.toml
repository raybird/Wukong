[package]
name = "wukong-runtime"
edition.workspace = true
version.workspace = true

[lib]
name = "wukong_runtime"
path = "src/lib.rs"

[features]
# Forwarded to wukong-memory so entrypoints can enable local embedding through
# the shared bootstrap helper. Off by default (BM25-only recall).
embed = ["wukong-memory/embed"]

[dependencies]
wukong-memory = { path = "../wukong-memory" }
wukong-gateway = { path = "../wukong-gateway" }
wukong-orchestrator = { path = "../wukong-orchestrator" }
wukong-skills = { path = "../wukong-skills" }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
