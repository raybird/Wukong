[package]
name = "wukong-web"
edition.workspace = true
version.workspace = true

[[bin]]
name = "wukong-web"
path = "src/main.rs"

[lib]
name = "wukong_web"
path = "src/lib.rs"

[dependencies]
wukong-memory = { path = "../wukong-memory" }
wukong-gateway = { path = "../wukong-gateway" }
wukong-cli = { path = "../wukong-cli" }
wukong-runtime = { path = "../wukong-runtime" }
wukong-orchestrator = { path = "../wukong-orchestrator" }
wukong-render = { path = "../wukong-render" }
wukong-settings = { path = "../wukong-settings" }
wukong-scheduler = { path = "../wukong-scheduler" }
wukong-chat-history = { path = "../wukong-chat-history" }
wukong-skills = { path = "../wukong-skills" }
axum = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }

[features]
embed = ["wukong-memory/embed", "wukong-cli/embed", "wukong-runtime/embed"]
