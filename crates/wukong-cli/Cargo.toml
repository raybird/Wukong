[package]
name = "wukong-cli"
edition.workspace = true
version.workspace = true

[lib]
name = "wukong_cli"
path = "src/lib.rs"

[[bin]]
name = "wukong"
path = "src/main.rs"

[dependencies]
wukong-runtime = { path = "../wukong-runtime" }
wukong-scheduler = { path = "../wukong-scheduler" }
wukong-memory = { path = "../wukong-memory" }
wukong-gateway = { path = "../wukong-gateway" }
wukong-settings = { path = "../wukong-settings" }
tokio = { workspace = true }
clap = { workspace = true }

[features]
embed = ["wukong-memory/embed"]

[dev-dependencies]
tempfile = { workspace = true }
