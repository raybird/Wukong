[package]
name = "wukong-schedulerd"
edition.workspace = true
version.workspace = true

[[bin]]
name = "wukong-schedulerd"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
wukong-gateway = { path = "../wukong-gateway" }
wukong-memory = { path = "../wukong-memory" }
wukong-runtime = { path = "../wukong-runtime" }
wukong-scheduler = { path = "../wukong-scheduler" }
wukong-tg-client = { path = "../wukong-tg-client" }
wukong-render = { path = "../wukong-render" }
wukong-settings = { path = "../wukong-settings" }
wukong-chat-history = { path = "../wukong-chat-history" }

[dev-dependencies]
# Enables MockTgClient (defined in wukong-tg-client) for notify tests.
wukong-tg-client = { path = "../wukong-tg-client", features = ["mock"] }
tempfile = { workspace = true }

[features]
embed = ["wukong-memory/embed", "wukong-runtime/embed"]
